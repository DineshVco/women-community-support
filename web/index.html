<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    $FLUTTER_BASE_HREF is replaced by the `--base-href` argument of
    `flutter build web` (default "/").
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Looma: a calm, moderated space where women support each other.">
  <meta name="theme-color" content="#FEF7F2">

  <!-- Add to Home Screen on iPhone: opens full screen, like an app. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Looma">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Looma</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Cream while Flutter starts, instead of a white flash. */
    html, body { background: #FEF7F2; margin: 0; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
